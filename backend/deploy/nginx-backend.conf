# nginx reverse proxy for the Perfect Foundation Django backend.
# Replace api.example.com with the real backend domain.
#
#   sudo cp backend/deploy/nginx-backend.conf /etc/nginx/sites-available/perfect-foundation
#   sudo ln -s /etc/nginx/sites-available/perfect-foundation /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Static files are served by WhiteNoise (inside gunicorn), so nginx only
# needs to proxy. Media uploads are not used yet; add a /media/ location
# pointing at a persistent volume if you introduce uploads later.

server {
    listen 80;
    server_name api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    # certbot --nginx handles these two lines.
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 75s;
        proxy_read_timeout 300s;
    }
}
