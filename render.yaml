# ==========================================================================
# Render Blueprint for the Perfect Foundation backend.
#
# HOW TO USE
#   1. Create a free Postgres on Neon (https://neon.tech - no credit card,
#      no 30-day expiry). Copy its connection string:
#        postgresql://user:pass@ep-xxx.us-east-1.aws.neon.tech/neondb?sslmode=require
#      and paste it into the DATABASE_URL value below (REPLACE_ME).
#   2. Ensure this file is committed and pushed to GitHub
#      (the `repo:` URL below must match your actual repository).
#   3. Render Dashboard -> New -> Blueprint -> New Blueprint Instance,
#      connect your GitHub repo, and deploy.
#      (Alternative: `render blueprint launch` from the CLI.)
#      The blueprint provisions ONLY the free web service - no managed
#      Postgres, so no credit card is needed on Render.
#   4. After the deploy turns green, note the backend URL, e.g.
#      https://perfect-foundation-backend.onrender.com
#   5. Put that URL into frontend/vercel.json (the /api rewrite target)
#      and deploy the frontend on Vercel.
#   6. Render dashboard -> backend service -> Shell, then run:
#        python manage.py createsuperuser
#   7. If login returns a CSRF 403, set DJANGO_CSRF_TRUSTED_ORIGINS to
#      your exact Vercel origin below.
# ==========================================================================

services:
  # Django backend ----------------------------------------------------------
  - type: web
    name: perfect-foundation-backend
    runtime: docker
    repo: https://github.com/lordvalicious/perfect-foundation-sms
    branch: Improvement-2
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    region: singapore
    healthCheckPath: /api/health/
    # Note: free-tier services don't support `preDeployCommand`; migrations
    # + collectstatic are handled at runtime by the dockerCommand below.
    dockerCommand: sh ./startup.sh && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Tighten this after adding a custom domain:
      #   e.g. app.yourdomain.com,www.yourdomain.com
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      # Origin (scheme + host) of the Vercel frontend. Must match exactly
      # the URL your users open in the browser.
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://perfect-foundation-sms.vercel.app
      # Neon free Postgres. This value is NOT used for the VPS deployment
      # (the connection string lives in the server's backend/.env, which is
      # gitignored). If you ever use this Render blueprint, paste your Neon
      # connection string here before deploying.
      - key: DATABASE_URL
        value: REPLACE_ME
